<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ | Body Scent</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">

  <style>
    /* ตารางรายการสั่งซื้อ: เส้นบาง โทนเดียวกับหน้าอื่น */
    .table-wrap {
      overflow-x: auto;
      border-top: 1px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
    }

    #ordersTable {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2);
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }

    #ordersTable thead th {
      font-weight: 500;
      white-space: nowrap;
      background: var(--cream);
      border-bottom: 1px solid var(--line-strong);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    /* คอลัมน์วันเวลาไม่ตัดบรรทัด, คอลัมน์จำนวนเงินชิดขวา */
    #ordersTable th:nth-child(1),
    #ordersTable td:nth-child(1) {
      white-space: nowrap;
    }

    #ordersTable th:nth-child(5),
    #ordersTable td:nth-child(5) {
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1>รายการสั่งซื้อ</h1>
          <span class="rule" aria-hidden="true"></span>
          <p class="lead">เรียงจากรายการล่าสุดขึ้นก่อน ข้อมูลอาจอัปเดตช้ากว่าความเป็นจริงเล็กน้อย</p>
        </div>

        <!-- script.js เติมข้อมูลลงใน tbody ให้เอง -->
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <span>&copy; 2026 Body Scent</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
